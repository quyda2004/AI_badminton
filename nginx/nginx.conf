events {
    worker_connections 1024;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Ẩn version nginx khỏi response header
    server_tokens off;

    upstream backend {
        server backend:8000;
    }

    upstream ai {
        server ai:8001;
    }

    server {
        listen 80;

        # ── Backend API ──────────────────────────────────────────
        # Frontend gọi /api/courts → nginx strip /api → backend nhận /courts
        location /api/ {
            proxy_pass         http://backend/;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── AI Service ───────────────────────────────────────────
        # Frontend gọi /ai/chat → nginx giữ nguyên path → ai-service nhận /ai/chat
        location /ai/ {
            proxy_pass         http://ai;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;

            # Cho phép long-polling nếu sau này thêm streaming
            proxy_read_timeout 120s;
        }

        # ── Health check của gateway ─────────────────────────────
        location /health {
            return 200 '{"status":"ok","gateway":"nginx"}';
            add_header Content-Type application/json;
        }

        # ── Frontend static files ─────────────────────────────────
        location / {
            root       /usr/share/nginx/html;
            index      index.html;
            try_files  $uri $uri/ /index.html;
            charset    utf-8;
        }
    }
}
