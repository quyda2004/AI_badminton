services:

  # ── Databases ────────────────────────────────────────────────
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB:       ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:     ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout:  5s
      retries:  10

  mongodb:
    image: mongo:7
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:     ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout:  5s
      retries:  10

  # ── Backend service ──────────────────────────────────────────
  backend:
    build:
      context:    .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: postgres   # override localhost → tên service trong docker
    depends_on:
      postgres:
        condition: service_healthy

  # ── AI service ───────────────────────────────────────────────
  ai:
    build:
      context:    .
      dockerfile: ai_service/Dockerfile
    env_file: .env
    environment:
      MONGODB_URI:          mongodb://mongodb:27017   # override localhost
      BACKEND_SERVICE_URL:  http://backend:8000       # gọi backend qua tên service
    depends_on:
      mongodb:
        condition: service_healthy
      backend:
        condition: service_started

  # ── API Gateway + Frontend ───────────────────────────────────
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - ai

volumes:
  postgres_data:
  mongo_data:
